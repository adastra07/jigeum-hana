name: Publish shareable APK
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Publish the tested v1.13 APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/share-apk"
          gh run download 44133475420 --name jigeum-hana-debug-17 --dir "$RUNNER_TEMP/share-apk"
          cd "$RUNNER_TEMP/share-apk"
          printf '%s\n' 'c2f1172defb140f9dd96b8ca82f722e0b248e8f92a4fffcd07c01b4681f3df80  app-debug.apk' | sha256sum --check
          mv app-debug.apk jigeum-hana-v1.13.apk
          gh release create v1.13 jigeum-hana-v1.13.apk --draft --target "${{ github.sha }}" --title '지금 하나 v1.13' --notes 'Android용 APK입니다. 아래 jigeum-hana-v1.13.apk를 다운로드하여 설치할 수 있습니다. 체크리스트 항목을 길게 누른 뒤 끌어 순서를 바꿀 수 있습니다. 순서는 분류별로 저장됩니다.'
          gh release edit v1.13 --draft=false
          gh release view v1.13 --json url --jq .url
