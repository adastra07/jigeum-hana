name: Android Debug APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      # Debug-only identity: cache eviction may change the signing certificate.
      # Never use this cache for a production key.
      - name: Restore debug signing identity
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: jigeum-hana-debug-signing-v1
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build, unit tests and lint
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jigeum-hana-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports-${{ github.run_number }}
          path: app/build/reports/
          if-no-files-found: ignore
